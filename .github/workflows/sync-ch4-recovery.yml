name: Sync chapter 4 recovery

on:
  push:
    paths:
      - '.github/workflows/sync-ch4-recovery.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize chapter 4 canonical records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reg = Path('figures/registry.md')
          text = reg.read_text(encoding='utf-8')
          text = text.replace(
              '| **F005** | 제1권  | 4장     | 함수: 입력 상자→규칙→출력 상자                        | domain/target 개념                                                                              | 단순 일대일 함수로 제한하지 않기                                                             | **MISSING IN LATEST DOCX · VERIFY/RECOVER** |',
              '| **F005** | 제1권  | 4장     | 함수: 입력 상자→규칙→출력 상자                        | domain/target 개념                                                                              | 단순 일대일 함수로 제한하지 않기                                                             | **ASSET PRESENT · DRAFT COMPLETE · AUDIT PASS** |'
          )
          text = text.replace(
              '| **F1X02** | 제1권 | 4장 | 숫자→숫자 / 점→색 / 점→방향 map 비교 | 출력이 숫자에 한정되지 않음을 직관화 | 세 예시는 서로 다른 map 유형의 예이며 Planck-S² 물리 증명이 아님 | **MISSING IN LATEST DOCX · VERIFY/RECOVER** |',
              '| **F1X02** | 제1권 | 4장 | 숫자→숫자 / 점→색 / 점→방향 map 비교 | 출력이 숫자에 한정되지 않음을 직관화 | 세 예시는 서로 다른 map 유형의 예이며 Planck-S² 물리 증명이 아님 | **ASSET PRESENT · DRAFT COMPLETE · AUDIT PASS** |'
          )
          reg.write_text(text, encoding='utf-8')

          ch = Path('volume-1/04-function.md')
          text = ch.read_text(encoding='utf-8')
          text = text.replace('../figures/volume-1/F005.png', '../figures/volume-1/F005.svg')
          text = text.replace('../figures/volume-1/F1X02.png', '../figures/volume-1/F1X02.svg')
          ch.write_text(text, encoding='utf-8')

          Path('.github/workflows/sync-ch4-recovery.yml').unlink()
          PY
      - name: Commit synchronized records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/registry.md volume-1/04-function.md .github/workflows/sync-ch4-recovery.yml
          git commit -m "audit: synchronize chapter 4 recovery records"
          git push
