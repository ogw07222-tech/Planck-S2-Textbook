name: Build Volume 1 Ebook
on:
  push:
    paths:
      - '.github/workflows/build-volume1-ebook.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ebook toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pandoc texlive-xetex texlive-lang-korean texlive-latex-extra fonts-noto-cjk librsvg2-bin

      - name: Build reader edition source and assets
        run: |
          mkdir -p build/volume1-ebook
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          v1 = root / 'volume-1'
          out = root / 'build' / 'volume1-ebook'

          chapter_names = [
              '01-particle.md','02-dimension.md','03-circle-sphere.md','04-function.md',
              '05-field.md','06-s2-to-s2.md','07-degree-q.md','08-q1-meaning.md',
              '09-configuration.md','10-configuration-space.md','11-path.md','12-loop.md',
              '13-homotopy.md','14-fundamental-group.md','15-z2.md','16-history-v01-v03.md',
              '17-closing.md'
          ]

          def reader_clean(text: str) -> str:
              lines = text.splitlines()
              while lines and not lines[0].startswith('# '):
                  lines.pop(0)
              text = '\n'.join(lines).strip() + '\n'
              lines = text.splitlines()
              cleaned = []
              skipping = False
              for line in lines:
                  if re.match(r'^##\s+(제\d+장 제작 기록|제1권 마무리 제작 기록)\s*$', line):
                      skipping = True
                      continue
                  if skipping and line.startswith('[^'):
                      skipping = False
                  if skipping:
                      continue
                  cleaned.append(line)
              return '\n'.join(cleaned).strip() + '\n'

          front = '''---
          title: "Planck-S²를 처음부터 이해하는 책"
          subtitle: "제1권 · 구 위의 화살표에서 위상수학까지"
          author: "Planck-S² Research Project"
          date: "2026-08-29 · Independent Audit PASS Reader Edition"
          lang: ko-KR
          documentclass: scrreprt
          classoption:
            - oneside
            - openany
          fontsize: 11pt
          geometry:
            - paperwidth=148mm
            - paperheight=210mm
            - inner=16mm
            - outer=16mm
            - top=18mm
            - bottom=20mm
          toc: true
          toc-depth: 2
          colorlinks: true
          linkcolor: blue
          urlcolor: blue
          CJKmainfont: "Noto Sans CJK KR"
          mainfont: "Noto Sans CJK KR"
          sansfont: "Noto Sans CJK KR"
          ---

          # 독자판 안내

          이 파일은 GitHub `main`의 **제1권 독립 감사 PASS 상태**를 바탕으로 만든 읽기용 eBook 판본이다.

          원문의 수학적·물리적 판정과 한계 문구는 유지하고, GitHub 작업용 배너와 제작 기록만 읽기 흐름을 위해 제외했다.

          > **전체 Planck-S²의 현재 상태는 WORKING HYPOTHESIS다.**  
          > 이 책에서 다루는 ideal mapping-space의 일부 결과가 실제 전자에 대한 물리적 증명을 뜻하지는 않는다.

          \\clearpage
          '''
          front = '\n'.join(x[10:] if x.startswith('          ') else x for x in front.splitlines())

          merged = [front]
          for i, name in enumerate(chapter_names):
              text = (v1 / name).read_text(encoding='utf-8')
              merged.append(reader_clean(text))
              if i != len(chapter_names)-1:
                  merged.append('\n\\clearpage\n')

          combined = '\n\n'.join(merged)
          combined = combined.replace('../figures/volume-1/', '../../figures/volume-1/')
          (out / 'volume1_reader.md').write_text(combined, encoding='utf-8')
          (out / 'volume1_reader_pdf.md').write_text(combined.replace('.svg)', '.png)'), encoding='utf-8')
          PY

          for f in figures/volume-1/*.svg; do
            rsvg-convert -w 1800 "$f" -o "${f%.svg}.png"
          done

      - name: Create cover and style files
        run: |
          cat > build/volume1-ebook/cover.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#071a2d"/>
                <stop offset="0.55" stop-color="#102f4e"/>
                <stop offset="1" stop-color="#24527a"/>
              </linearGradient>
              <radialGradient id="orb" cx="50%" cy="45%" r="50%">
                <stop offset="0" stop-color="#9ed7ff" stop-opacity="0.35"/>
                <stop offset="1" stop-color="#9ed7ff" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="1600" height="2560" fill="url(#bg)"/>
            <circle cx="800" cy="1120" r="560" fill="url(#orb)"/>
            <circle cx="800" cy="1120" r="355" fill="none" stroke="#c5e7ff" stroke-width="3" opacity="0.7"/>
            <ellipse cx="800" cy="1120" rx="355" ry="120" fill="none" stroke="#c5e7ff" stroke-width="3" opacity="0.45"/>
            <ellipse cx="800" cy="1120" rx="120" ry="355" fill="none" stroke="#c5e7ff" stroke-width="3" opacity="0.45"/>
            <text x="800" y="410" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="58" fill="#a9d9ff" letter-spacing="7">PLANCK-S²</text>
            <text x="800" y="560" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="76" font-weight="700" fill="white">처음부터 이해하는 책</text>
            <text x="800" y="720" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="52" fill="#d5edff">제1권</text>
            <text x="800" y="800" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="48" fill="#d5edff">구 위의 화살표에서 위상수학까지</text>
            <text x="800" y="1940" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="34" fill="#d5edff">Reader Edition · Independent Audit PASS</text>
            <text x="800" y="2010" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="30" fill="#a9d9ff">WORKING HYPOTHESIS</text>
            <line x1="470" y1="2100" x2="1130" y2="2100" stroke="#a9d9ff" opacity="0.45"/>
            <text x="800" y="2190" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="28" fill="#cbe7fb">2026-08-29</text>
          </svg>
          SVG
          rsvg-convert -w 1600 -h 2560 build/volume1-ebook/cover.svg -o build/volume1-ebook/cover.png

          cat > build/volume1-ebook/ebook_header.tex <<'TEX'
          \usepackage{xcolor}
          \usepackage{titlesec}
          \usepackage{fancyhdr}
          \usepackage{microtype}
          \usepackage{booktabs}
          \usepackage{longtable}
          \usepackage{array}
          \usepackage{setspace}
          \usepackage{enumitem}
          \definecolor{Ink}{HTML}{13283B}
          \definecolor{Accent}{HTML}{1E5A85}
          \setstretch{1.22}
          \setlength{\parindent}{0pt}
          \setlength{\parskip}{0.55em}
          \setlength{\tabcolsep}{4pt}
          \renewcommand{\arraystretch}{1.12}
          \setlist[itemize]{itemsep=0.25em,topsep=0.35em}
          \setlist[enumerate]{itemsep=0.25em,topsep=0.35em}
          \titleformat{\chapter}[display]
            {\normalfont\bfseries\color{Ink}}
            {}
            {0pt}
            {\titlerule\vspace{1.2ex}\Huge}
          \titleformat{\section}{\Large\bfseries\color{Ink}}{}{0pt}{}
          \titleformat{\subsection}{\large\bfseries\color{Accent}}{}{0pt}{}
          \pagestyle{fancy}
          \fancyhf{}
          \fancyhead[L]{\small\color{Accent}Planck-S² · 제1권}
          \fancyhead[R]{\small\color{Ink}\leftmark}
          \fancyfoot[C]{\small\thepage}
          \renewcommand{\headrulewidth}{0.3pt}
          \AtBeginEnvironment{quote}{\color{Ink}\small}
          \hypersetup{pdfauthor={Planck-S² Research Project},pdftitle={Planck-S²를 처음부터 이해하는 책 - 제1권}}
          TEX

          cat > build/volume1-ebook/ebook.css <<'CSS'
          body { font-family: sans-serif; line-height: 1.72; color: #142536; max-width: 42em; margin: auto; }
          h1 { color: #143e5d; border-bottom: 2px solid #78a9c9; padding-bottom: .35em; margin-top: 1.8em; }
          h2 { color: #173f5f; margin-top: 1.6em; }
          h3 { color: #285f86; }
          blockquote { margin: 1.1em 0; padding: .75em 1em; background: #eef5fa; border-left: 4px solid #4f86ad; }
          table { border-collapse: collapse; width: 100%; font-size: .9em; }
          th, td { border-bottom: 1px solid #cfdbe4; padding: .45em .5em; vertical-align: top; }
          th { background: #eef5fa; }
          img { max-width: 100%; height: auto; display: block; margin: 1.2em auto; }
          code { background: #f3f5f7; padding: .1em .25em; }
          .footnotes { font-size: .88em; color: #41576a; }
          CSS

      - name: Build PDF
        run: |
          cd build/volume1-ebook
          pandoc volume1_reader_pdf.md \
            --from markdown+footnotes+tex_math_dollars+raw_tex \
            --pdf-engine=xelatex \
            --toc --toc-depth=2 \
            --top-level-division=chapter \
            --include-in-header=ebook_header.tex \
            -V CJKmainfont='Noto Sans CJK KR' \
            -V mainfont='Noto Sans CJK KR' \
            -V sansfont='Noto Sans CJK KR' \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -o Planck-S2_Volume1_Reader_Edition.pdf

      - name: Build EPUB
        run: |
          cd build/volume1-ebook
          pandoc volume1_reader_pdf.md \
            --from markdown+footnotes+tex_math_dollars \
            --toc --toc-depth=2 \
            --css=ebook.css \
            --epub-cover-image=cover.png \
            --metadata title='Planck-S²를 처음부터 이해하는 책 - 제1권' \
            --metadata subtitle='구 위의 화살표에서 위상수학까지' \
            --metadata lang='ko-KR' \
            -o Planck-S2_Volume1_Reader_Edition.epub

      - name: Package files
        run: |
          cd build/volume1-ebook
          sha256sum Planck-S2_Volume1_Reader_Edition.pdf Planck-S2_Volume1_Reader_Edition.epub > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Planck-S2-Volume1-Ebook
          path: |
            build/volume1-ebook/Planck-S2_Volume1_Reader_Edition.pdf
            build/volume1-ebook/Planck-S2_Volume1_Reader_Edition.epub
            build/volume1-ebook/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
