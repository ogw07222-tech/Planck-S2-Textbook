name: Build Volume 1 EPUB Page Unit
on:
  push:
    paths:
      - '.github/workflows/build-volume1-epub-pageunit.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pandoc fonts-noto-cjk librsvg2-bin zip unzip python3-bs4

      - name: Prepare reader source and cover
        run: |
          mkdir -p build/volume1-epub
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          v1 = root / 'volume-1'
          out = root / 'build' / 'volume1-epub'
          chapter_names = [
              '01-particle.md','02-dimension.md','03-circle-sphere.md','04-function.md',
              '05-field.md','06-s2-to-s2.md','07-degree-q.md','08-q1-meaning.md',
              '09-configuration.md','10-configuration-space.md','11-path.md','12-loop.md',
              '13-homotopy.md','14-fundamental-group.md','15-z2.md','16-history-v01-v03.md',
              '17-closing.md'
          ]

          def clean_chapter(text: str) -> str:
              lines = text.splitlines()
              while lines and not lines[0].startswith('# '):
                  lines.pop(0)
              # Remove production-record sections only; retain footnotes after them.
              cleaned, skipping = [], False
              for line in lines:
                  if re.match(r'^##\s+(제\d+장 제작 기록|제1권 마무리 제작 기록)\s*$', line):
                      skipping = True
                      continue
                  if skipping and line.startswith('[^'):
                      skipping = False
                  if skipping:
                      continue
                  cleaned.append(line)
              text = '\n'.join(cleaned).strip() + '\n'
              text = text.replace('../figures/volume-1/', 'figures/volume-1/')
              # Internalize canonical source ledgers so reader apps never try to open missing .md files.
              text = text.replace('../sources/source-index.md', '#source-index')
              text = text.replace('../sources/proof-status.md', '#proof-status')
              # STATUS is operational metadata; use an explicit web URL instead of a missing EPUB-relative file.
              text = text.replace('../STATUS.md', 'https://github.com/ogw07222-tech/Planck-S2-Textbook/blob/main/STATUS.md')
              return text

          front = '''---
          title: "Planck-S²를 처음부터 이해하는 책"
          subtitle: "제1권 · 구 위의 화살표에서 위상수학까지"
          author: "Planck-S² Research Project"
          date: "2026-08-30 · Reader Edition · Page Unit EPUB"
          lang: ko-KR
          ---

          # 독자판 안내

          이 EPUB은 제1권 독립 감사 PASS 상태를 바탕으로 만든 **페이지 정돈형 Reader Edition**이다.

          짧은 소단원은 전자책 리더가 허용하는 범위에서 한 페이지 단위로 묶이도록 강한 page-break 규칙을 사용한다. 화면 크기와 글자 크기에 따라 실제 페이지 수는 달라질 수 있지만, 소단원 중간 분할을 줄이고 다음 페이지로 넘길 여백을 허용하도록 설계했다.

          > **전체 Planck-S²의 현재 상태는 WORKING HYPOTHESIS다.**  
          > ideal mapping-space의 일부 수학 결과가 실제 전자에 대한 물리적 증명을 뜻하지는 않는다.
          '''
          front = '\n'.join(x[10:] if x.startswith('          ') else x for x in front.splitlines())

          parts = [front]
          for name in chapter_names:
              parts.append(clean_chapter((v1 / name).read_text(encoding='utf-8')))

          src = (root / 'sources' / 'source-index.md').read_text(encoding='utf-8')
          src = re.sub(r'^#\s+Source Index\s*$', '# Source Index {#source-index}', src, count=1, flags=re.M)
          proof = (root / 'sources' / 'proof-status.md').read_text(encoding='utf-8')
          proof = re.sub(r'^#\s+Proof Status[^\n]*$', '# Proof Status — Canonical Baseline {#proof-status}', proof, count=1, flags=re.M)

          parts.append('''# 부록 · 프로젝트 출처와 증명상태\n\n본문의 **source index**와 **proof-status ledger** 링크는 아래 부록으로 연결된다. EPUB 내부에 포함했으므로 네트워크 연결 없이 열 수 있다.\n''')
          parts.append(src)
          parts.append(proof)

          (out / 'volume1_reader.md').write_text('\n\n'.join(parts), encoding='utf-8')
          PY

          cat > build/volume1-epub/cover.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2269" viewBox="0 0 1600 2269">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#071a2d"/>
                <stop offset="0.55" stop-color="#102f4e"/>
                <stop offset="1" stop-color="#24527a"/>
              </linearGradient>
              <radialGradient id="orb" cx="50%" cy="45%" r="50%">
                <stop offset="0" stop-color="#9ed7ff" stop-opacity="0.35"/>
                <stop offset="1" stop-color="#9ed7ff" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="1600" height="2269" fill="url(#bg)"/>
            <circle cx="800" cy="1040" r="530" fill="url(#orb)"/>
            <circle cx="800" cy="1040" r="345" fill="none" stroke="#c5e7ff" stroke-width="3" opacity="0.7"/>
            <ellipse cx="800" cy="1040" rx="345" ry="118" fill="none" stroke="#c5e7ff" stroke-width="3" opacity="0.45"/>
            <ellipse cx="800" cy="1040" rx="118" ry="345" fill="none" stroke="#c5e7ff" stroke-width="3" opacity="0.45"/>
            <text x="800" y="340" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="58" fill="#a9d9ff" letter-spacing="7">PLANCK-S²</text>
            <text x="800" y="480" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="76" font-weight="700" fill="white">처음부터 이해하는 책</text>
            <text x="800" y="625" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="52" fill="#d5edff">제1권</text>
            <text x="800" y="700" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="48" fill="#d5edff">구 위의 화살표에서 위상수학까지</text>
            <text x="800" y="1780" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="34" fill="#d5edff">Page Unit EPUB · Independent Audit PASS</text>
            <text x="800" y="1850" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="30" fill="#a9d9ff">WORKING HYPOTHESIS</text>
            <line x1="470" y1="1940" x2="1130" y2="1940" stroke="#a9d9ff" opacity="0.45"/>
            <text x="800" y="2020" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="28" fill="#cbe7fb">2026-08-30</text>
          </svg>
          SVG
          rsvg-convert -w 1600 -h 2269 build/volume1-epub/cover.svg -o build/volume1-epub/cover.png

          cat > build/volume1-epub/ebook.css <<'CSS'
          body { font-family: sans-serif; line-height: 1.72; color: #142536; max-width: 42em; margin: auto; widows: 3; orphans: 3; }
          h1 { color: #143e5d; border-bottom: 2px solid #78a9c9; padding-bottom: .35em; margin-top: 1.6em; }
          h2 { color: #173f5f; margin-top: 1.45em; }
          h3 { color: #285f86; }
          h1, h2, h3 { page-break-after: avoid !important; break-after: avoid-page !important; -webkit-column-break-after: avoid !important; }
          blockquote { margin: 1.1em 0; padding: .75em 1em; background: #eef5fa; border-left: 4px solid #4f86ad; }
          table { border-collapse: collapse; width: 100%; font-size: .9em; }
          th, td { border-bottom: 1px solid #cfdbe4; padding: .45em .5em; vertical-align: top; }
          th { background: #eef5fa; }
          img { max-width: 100%; height: auto; display: block; margin: 1.2em auto; }
          code { background: #f3f5f7; padding: .1em .25em; }
          .footnotes { font-size: .88em; color: #41576a; }
          figure, figcaption, blockquote, tr, li { page-break-inside: avoid !important; break-inside: avoid-page !important; -webkit-column-break-inside: avoid !important; }
          hr { border: 0; border-top: 1px solid #b8c9d6; margin: 1.15em 0 .25em; }

          /* Stronger pagination than the previous EPUB. A short horizontal-rule section is treated as a page unit. */
          section.page-unit {
            page-break-before: always !important;
            break-before: page !important;
            -webkit-column-break-before: always !important;
            page-break-inside: avoid !important;
            break-inside: avoid-page !important;
            -webkit-column-break-inside: avoid !important;
            column-break-inside: avoid !important;
          }
          section.page-unit:first-child { page-break-before: auto !important; break-before: auto !important; -webkit-column-break-before: auto !important; }
          CSS

      - name: Build EPUB and apply page-unit rules
        run: |
          pandoc build/volume1-epub/volume1_reader.md \
            --from markdown+footnotes+tex_math_dollars+raw_html \
            --toc --toc-depth=2 \
            --css=build/volume1-epub/ebook.css \
            --epub-cover-image=build/volume1-epub/cover.png \
            --resource-path=.:volume-1:figures/volume-1:build/volume1-epub \
            --metadata title='Planck-S²를 처음부터 이해하는 책 - 제1권' \
            --metadata subtitle='구 위의 화살표에서 위상수학까지 · 페이지 정돈형' \
            --metadata lang='ko-KR' \
            -o build/volume1-epub/base.epub

          rm -rf build/volume1-epub/unpacked
          mkdir -p build/volume1-epub/unpacked
          cd build/volume1-epub/unpacked
          unzip -q ../base.epub
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re

          epub = Path('EPUB')
          text_dir = epub / 'text'
          changed_units = 0
          md_links = []

          for path in sorted(text_dir.glob('*.xhtml')):
              raw = path.read_text(encoding='utf-8')
              soup = BeautifulSoup(raw, 'xml')
              body = soup.find('body')
              if body:
                  sections = body.find_all('section', recursive=True)
                  for sec in sections:
                      classes = sec.get('class') or []
                      if 'level2' not in classes:
                          continue
                      # Source/proof appendices are reference ledgers; do not force every subsection to a page.
                      ancestor_h1 = sec.find_parent('section', class_='level1')
                      h1 = ancestor_h1.find('h1') if ancestor_h1 else None
                      h1txt = h1.get_text(' ', strip=True) if h1 else ''
                      if 'Source Index' in h1txt or 'Proof Status' in h1txt or '부록 · 프로젝트 출처' in h1txt:
                          continue
                      txtlen = len(sec.get_text(' ', strip=True))
                      rows = len(sec.find_all('tr'))
                      # Treat compact horizontal-rule-delimited instructional blocks as page units.
                      if txtlen <= 1450 and rows <= 6:
                          sec['class'] = list(dict.fromkeys(classes + ['page-unit']))
                          changed_units += 1

              # Final safety: no EPUB-internal link may point to an unpackaged Markdown file.
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  if href.endswith('.md') or '.md#' in href:
                      md_links.append((path.name, href))
                      if 'source-index.md' in href:
                          a['href'] = '#source-index'
                      elif 'proof-status.md' in href:
                          a['href'] = '#proof-status'
                      elif 'STATUS.md' in href:
                          a['href'] = 'https://github.com/ogw07222-tech/Planck-S2-Textbook/blob/main/STATUS.md'
              path.write_text(str(soup), encoding='utf-8')

          css = next((epub / 'styles').glob('*.css'))
          extra = '''\n/* EPUB page-unit compatibility refinement */\nsection.page-unit{page-break-before:always!important;break-before:page!important;-webkit-column-break-before:always!important;page-break-inside:avoid!important;break-inside:avoid-page!important;-webkit-column-break-inside:avoid!important;column-break-inside:avoid!important;}\nh1,h2,h3{page-break-after:avoid!important;break-after:avoid-page!important;-webkit-column-break-after:avoid!important;}\nfigure,blockquote,tr,li{page-break-inside:avoid!important;break-inside:avoid-page!important;-webkit-column-break-inside:avoid!important;}\n'''
          css.write_text(css.read_text(encoding='utf-8') + extra, encoding='utf-8')

          # Verify that source-index and proof-status anchors exist somewhere in the packaged XHTML.
          allxml = '\n'.join(p.read_text(encoding='utf-8') for p in text_dir.glob('*.xhtml'))
          assert 'id="source-index"' in allxml, 'source-index anchor missing'
          assert 'id="proof-status"' in allxml, 'proof-status anchor missing'
          # Verify no local Markdown href survives.
          survivors = re.findall(r'href="[^"]*\.md(?:#[^"]*)?"', allxml)
          assert not survivors, f'broken markdown hrefs remain: {survivors[:5]}'
          print('page units:', changed_units)
          print('rewritten markdown links:', len(md_links))
          PY

          # Repack EPUB with mimetype first and stored (required for maximum reader compatibility).
          rm -f ../Planck-S2_제1권_Reader_Edition_페이지정돈_v2.epub
          zip -X0 ../Planck-S2_제1권_Reader_Edition_페이지정돈_v2.epub mimetype
          zip -Xr9D ../Planck-S2_제1권_Reader_Edition_페이지정돈_v2.epub META-INF EPUB -x '*.DS_Store'
          cd ..

          # Structural smoke tests.
          unzip -t Planck-S2_제1권_Reader_Edition_페이지정돈_v2.epub
          python3 - <<'PY'
          import zipfile, re
          p='Planck-S2_제1권_Reader_Edition_페이지정돈_v2.epub'
          with zipfile.ZipFile(p) as z:
              assert z.namelist()[0]=='mimetype'
              assert z.read('mimetype')==b'application/epub+zip'
              texts='\n'.join(z.read(n).decode('utf-8','ignore') for n in z.namelist() if n.endswith('.xhtml'))
              assert 'source-index' in texts and 'proof-status' in texts
              assert not re.search(r'href="[^"]*\.md(?:#[^"]*)?"', texts)
          print('EPUB structural checks passed')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Planck-S2-Volume1-EPUB-PageUnit-v2
          path: build/volume1-epub/Planck-S2_제1권_Reader_Edition_페이지정돈_v2.epub
          if-no-files-found: error
          retention-days: 7
