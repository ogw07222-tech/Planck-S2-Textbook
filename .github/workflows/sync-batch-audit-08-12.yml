name: Sync Batch Audit 08-12
on:
  push:
    paths:
      - '.github/workflows/sync-batch-audit-08-12.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize batch audit PASS state
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter_files = [
              'volume-1/08-q1-meaning.md',
              'volume-1/09-configuration.md',
              'volume-1/10-configuration-space.md',
              'volume-1/11-path.md',
              'volume-1/12-loop.md',
          ]
          for name in chapter_files:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('AUDIT PENDING', 'PASS')
              p.write_text(s, encoding='utf-8')

          # Remove now-stale blocking text in chapter headers/records while keeping scientific content unchanged.
          p = Path('volume-1/08-q1-meaning.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('이 장은 작성 Chat의 초안이다. 아직 독립 감사 PASS가 아니다. 제9장은 이 장의 독립 감사가 끝나기 전까지 시작하지 않는다.', '이 장은 독립 감사 PASS를 받았다. 과학적 경계와 proof-status는 frozen baseline을 따른다.')
          s = s.replace('- **다음 작업:** Independent audit of Chapter 8', '- **독립 감사:** PASS — 2026-08-29')
          s = s.replace('- **금지 작업:** Chapter 9 본문 시작', '- **후속 상태:** Chapters 9–12 batch audit completed separately')
          p.write_text(s, encoding='utf-8')

          for name in ['volume-1/09-configuration.md','volume-1/10-configuration-space.md','volume-1/11-path.md']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('OVERNIGHT BATCH DRAFT MODE에서 작성한 초안이다. 작성 Chat은 PASS를 부여하지 않는다. 제8~12장은 순차 독립 감사가 필요하다.', 'OVERNIGHT BATCH DRAFT MODE에서 작성된 뒤 독립 순차 감사 PASS를 받았다.')
              p.write_text(s, encoding='utf-8')

          p = Path('volume-1/12-loop.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('OVERNIGHT BATCH DRAFT MODE에서 작성한 초안이다. 작성 Chat은 PASS를 부여하지 않는다. 이 장은 loop의 표준 언어만 준비하며 $\\mathbb Z_2$, FR, 특정 2π rotation generator 결론을 앞당기지 않는다.', 'OVERNIGHT BATCH DRAFT MODE에서 작성된 뒤 독립 감사 PASS를 받았다. 이 장은 loop의 표준 언어만 준비하며 $\\mathbb Z_2$, FR, 특정 2π rotation generator 결론을 앞당기지 않는다.')
          s = s.replace('- **다음 허용 작업:** Independent sequential audit of Chapters 8–12', '- **다음 허용 작업:** Chapter 13 DRAFT')
          s = s.replace('- **DO NOT START:** Chapter 13 before overnight batch audit is completed', '- **DO NOT START:** Chapter 14 before Chapter 13 independent audit passes')
          s = s.replace('- **DO NOT START:** Chapter 13 before independent sequential audit of Chapters 8–12', '- **후속 작업:** Chapter 13 DRAFT APPROVED; Chapter 14 remains blocked pending Chapter 13 audit')
          p.write_text(s, encoding='utf-8')

          p = Path('figures/registry.md')
          lines = p.read_text(encoding='utf-8').splitlines()
          target_ids = {'F010','F1X05','F013','F014','F1X06','F015','F016'}
          for i, line in enumerate(lines):
              if any(f'**{fid}**' in line for fid in target_ids):
                  line = line.replace('REUSED IN Ch.8 AUDIT PENDING', 'REUSED IN Ch.8 AUDIT PASS')
                  line = line.replace('AUDIT PENDING', 'AUDIT PASS')
                  lines[i] = line
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p = Path('STATUS.md')
          s = p.read_text(encoding='utf-8')
          for ch in range(8,13):
              s = s.replace(f'| {ch} | DRAFT COMPLETE | AUDIT PENDING |', f'| {ch} | DRAFT COMPLETE | PASS |')
          s = s.replace('**Current next action:** Independent sequential audit of Chapters 8–12.', '**Current next action:** Draft Chapter 13 — 고무줄처럼 줄일 수 있는가: homotopy.')
          s = s.replace('**DO NOT START:** Chapter 13 before the overnight batch audit is completed.', '**DO NOT START:** Chapter 14 before Chapter 13 independent audit passes.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit synchronized batch audit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add volume-1/08-q1-meaning.md volume-1/09-configuration.md volume-1/10-configuration-space.md volume-1/11-path.md volume-1/12-loop.md figures/registry.md STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'audit: synchronize chapters 8-12 PASS state'
          git push
