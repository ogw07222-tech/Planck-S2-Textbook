name: Sync Chapter 7 Audit Pass
on:
  push:
    paths:
      - '.github/workflows/sync-ch7-audit-pass.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize chapter 7 audit state
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('volume-1/07-degree-q.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('STATUS: DRAFT COMPLETE · AUDIT PENDING', 'STATUS: DRAFT COMPLETE · AUDIT PASS')
          s = s.replace('**감사 상태:** AUDIT PENDING', '**감사 상태:** PASS')
          s = s.replace('- **감사 판정:** AUDIT PENDING', '- **감사 판정:** PASS — 2026-08-29')
          p.write_text(s, encoding='utf-8')

          p = Path('figures/registry.md')
          s = p.read_text(encoding='utf-8')
          for fig in ['F009','F010','F011','F012','F1X04']:
              lines = s.splitlines()
              for i,line in enumerate(lines):
                  if f'**{fig}**' in line:
                      lines[i] = line.replace('AUDIT PENDING', 'AUDIT PASS')
              s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          p.write_text(s, encoding='utf-8')

          p = Path('STATUS.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 7 | DRAFT COMPLETE | AUDIT PENDING |', '| 7 | DRAFT COMPLETE | PASS |')
          s = s.replace('**Current next action:** Independent audit of Chapter 7.', '**Current next action:** Draft Chapter 8 — Q=1이 말해 주는 것과 말해 주지 않는 것을 분리한다.')
          s = s.replace('**DO NOT START:** Chapter 8 before Chapter 7 independent audit passes.', '**DO NOT START:** Chapter 9 before Chapter 8 independent audit passes.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit synchronized audit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add volume-1/07-degree-q.md figures/registry.md STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'audit: synchronize chapter 7 PASS state'
          git push
