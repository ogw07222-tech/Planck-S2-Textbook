name: Sync Chapter 5 Audit Pass
on:
  push:
    paths:
      - '.github/workflows/sync-ch5-audit-pass.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize chapter 5 audit state
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('volume-1/05-field.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('STATUS: DRAFT COMPLETE · AUDIT PENDING', 'STATUS: DRAFT COMPLETE · AUDIT PASS')
          s = s.replace('**감사 상태:** AUDIT PENDING', '**감사 상태:** PASS')
          s = s.replace('- **독립 감사:** PENDING', '- **독립 감사:** PASS — 2026-08-29')
          s = s.replace('- **다음 작업:** 독립 감사 Chat이 이 Markdown과 실제 그림 asset을 감사', '- **다음 작업:** 제6장 DRAFT 제작 허용')
          s = s.replace('- **금지:** Chapter 6 본문 시작 금지 — Chapter 5 audit PASS 필요', '- **감사 결과:** PASS — Chapter 6 DRAFT APPROVED')
          p.write_text(s, encoding='utf-8')

          p = Path('figures/registry.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ASSET PRESENT · DRAFT COMPLETE · AUDIT PENDING', 'ASSET PRESENT · DRAFT COMPLETE · AUDIT PASS', 2)
          p.write_text(s, encoding='utf-8')

          p = Path('STATUS.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 5 | DRAFT COMPLETE | AUDIT PENDING |', '| 5 | DRAFT COMPLETE | PASS |')
          s = s.replace('**Current next action:** Independent audit of Chapter 5.', '**Current next action:** Draft Chapter 6 — `S²→S²`의 domain과 target을 분리해 읽기.')
          s = s.replace('**DO NOT START:** Chapter 6 before Chapter 5 independent audit passes.', '**DO NOT START:** Chapter 7 before Chapter 6 independent audit passes.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit synchronized audit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add volume-1/05-field.md figures/registry.md STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'audit: synchronize chapter 5 PASS state'
          git push
