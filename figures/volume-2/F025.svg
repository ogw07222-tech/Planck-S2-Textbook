<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:18px}.sheet{fill:#f8fafc;stroke:#475569;stroke-width:3}.path{fill:none;stroke:#2563eb;stroke-width:6}.arr{stroke:#64748b;stroke-width:4;marker-end:url(#a)}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="640" y="50" text-anchor="middle" class="t">F025 · universal cover의 두 층 개념도</text><rect x="160" y="120" width="960" height="150" rx="22" class="sheet"/><rect x="160" y="340" width="960" height="150" rx="22" class="sheet"/><text x="220" y="165" class="h">cover sheet A</text><text x="220" y="385" class="h">cover sheet B</text><path d="M350 215 C520 120 700 285 900 205" class="path"/><circle cx="350" cy="215" r="9" fill="#111"/><circle cx="900" cy="205" r="9" fill="#111"/><line x1="900" y1="215" x2="900" y2="345" class="arr"/><text x="930" y="290" class="b">same base point</text><text x="640" y="540" text-anchor="middle" class="h">base의 nontrivial loop를 lift하면 cover에서는 열린 path가 될 수 있다.</text><rect x="150" y="590" width="980" height="105" rx="16" class="w"/><text x="640" y="630" text-anchor="middle" class="b">두 평면이 실제 물리적 공간 두 장이라는 뜻이 아니다.</text><text x="640" y="662" text-anchor="middle" class="b">Z₂ cover의 교육용 schematic이며 정확한 cover 기하는 별도 수학 구조다.</text></svg>