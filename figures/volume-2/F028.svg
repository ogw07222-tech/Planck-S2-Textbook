<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:19px}.top{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.bot{fill:#f8fafc;stroke:#475569;stroke-width:3}.arr{stroke:#334155;stroke-width:5;marker-end:url(#a)}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><text x="640" y="50" text-anchor="middle" class="t">F028 · SO(3)와 SU(2) double cover</text><rect x="160" y="110" width="960" height="180" rx="22" class="top"/><text x="640" y="160" text-anchor="middle" class="h">SU(2) ≅ S³ — simply connected cover</text><circle cx="430" cy="230" r="38" fill="white" stroke="#2563eb" stroke-width="3"/><circle cx="850" cy="230" r="38" fill="white" stroke="#2563eb" stroke-width="3"/><text x="430" y="237" text-anchor="middle" class="h">U</text><text x="850" y="237" text-anchor="middle" class="h">−U</text><rect x="260" y="410" width="760" height="150" rx="22" class="bot"/><text x="640" y="455" text-anchor="middle" class="h">SO(3)</text><text x="640" y="505" text-anchor="middle" class="b">U와 −U가 같은 3차원 rotation R에 대응</text><line x1="430" y1="270" x2="570" y2="405" class="arr"/><line x1="850" y1="270" x2="710" y2="405" class="arr"/><rect x="150" y="610" width="980" height="90" rx="15" class="w"/><text x="640" y="648" text-anchor="middle" class="b">표준 수학 구조 — SU(2)가 electron 내부의 실제 공간이라는 뜻이 아니다.</text><text x="640" y="678" text-anchor="middle" class="b">2π에서 U→−U, 4π에서 U→+U라는 cover 구조와 physical FR 적용은 구분한다.</text></svg>