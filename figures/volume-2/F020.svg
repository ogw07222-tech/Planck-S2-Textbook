<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:19px}.p{fill:#f8fafc;stroke:#475569;stroke-width:3}.a{fill:none;stroke:#2563eb;stroke-width:7}.c{fill:none;stroke:#7c3aed;stroke-width:7}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><text x="640" y="50" text-anchor="middle" class="t">F020 · 360°/720° 회전 경로 비교</text><rect x="70" y="105" width="520" height="400" rx="22" class="p"/><rect x="690" y="105" width="520" height="400" rx="22" class="p"/><text x="330" y="155" text-anchor="middle" class="h">360° loop</text><circle cx="330" cy="310" r="120" class="a"/><circle cx="330" cy="190" r="9" fill="#111"/><text x="330" y="465" text-anchor="middle" class="b">standard SO(3): noncontractible class</text><text x="950" y="155" text-anchor="middle" class="h">720° = loop 두 번</text><path d="M950 190 C1110 190 1110 430 950 430 C790 430 790 190 950 190 C1110 190 1110 430 950 430" class="c"/><circle cx="950" cy="190" r="9" fill="#111"/><text x="950" y="465" text-anchor="middle" class="b">standard SO(3): contractible class</text><rect x="120" y="560" width="1040" height="120" rx="16" class="w"/><text x="640" y="605" text-anchor="middle" class="h">belt trick / Dirac string trick은 이 차이를 보여 주는 시각화</text><text x="640" y="645" text-anchor="middle" class="b">Planck-S² field의 physical FR proof가 아니며, actual configuration-space topology는 별도 문제다.</text></svg>