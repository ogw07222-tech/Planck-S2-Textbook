<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:19px}.p{fill:#f8fafc;stroke:#475569;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><text x="640" y="50" text-anchor="middle" class="t">F022 · rotation orbit가 configuration-space loop가 되는 그림</text><rect x="70" y="110" width="1140" height="390" rx="22" class="p"/><circle cx="220" cy="300" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="480" cy="210" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="800" cy="210" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="1060" cy="300" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><path d="M275 285 C350 230 390 215 425 215" class="arr"/><path d="M535 210 C620 170 710 170 745 205" class="arr"/><path d="M855 225 C930 245 975 275 1005 292" class="arr"/><path d="M1060 355 C950 470 360 470 220 355" class="arr"/><text x="220" y="305" text-anchor="middle" class="h">n₀</text><text x="480" y="215" text-anchor="middle" class="h">n_t</text><text x="800" y="215" text-anchor="middle" class="h">n_t'</text><text x="1060" y="305" text-anchor="middle" class="h">n₁=n₀</text><text x="640" y="475" text-anchor="middle" class="b">γ(t)=n_t,  γ(0)=γ(1) → loop</text><rect x="150" y="555" width="980" height="120" rx="16" class="w"/><text x="640" y="600" text-anchor="middle" class="b">ideal smooth/unquotiented Map₁의 개념도</text><text x="640" y="640" text-anchor="middle" class="b">physical quotient 여부와 actual electron configuration space는 제15장의 OPEN 문제다.</text></svg>