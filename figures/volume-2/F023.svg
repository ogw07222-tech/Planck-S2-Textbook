<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:18px}.box{fill:#f8fafc;stroke:#475569;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><text x="640" y="50" text-anchor="middle" class="t">F023 · evaluation fibration 계단</text><rect x="90" y="140" width="300" height="150" rx="18" class="box"/><rect x="490" y="140" width="300" height="150" rx="18" class="box"/><rect x="890" y="140" width="300" height="150" rx="18" class="box"/><text x="240" y="190" text-anchor="middle" class="h">fiber F₁</text><text x="240" y="230" text-anchor="middle" class="b">n(x₀)=y₀를 고정한 maps</text><text x="640" y="190" text-anchor="middle" class="h">total C₁</text><text x="640" y="230" text-anchor="middle" class="b">degree-1 mapping space</text><text x="1040" y="190" text-anchor="middle" class="h">base S²</text><text x="1040" y="230" text-anchor="middle" class="b">평가값 n(x₀)</text><line x1="390" y1="215" x2="480" y2="215" class="arr"/><line x1="790" y1="215" x2="880" y2="215" class="arr"/><text x="835" y="195" text-anchor="middle" class="b">ev</text><rect x="180" y="370" width="920" height="160" rx="18" class="box"/><text x="640" y="415" text-anchor="middle" class="h">long exact sequence가 하는 일</text><text x="640" y="455" text-anchor="middle" class="b">fiber · total · base의 homotopy group을 서로 연결하여</text><text x="640" y="490" text-anchor="middle" class="b">π₁(C₁)를 계산할 수 있는 정보를 전달한다.</text><rect x="165" y="585" width="950" height="90" rx="15" class="w"/><text x="640" y="625" text-anchor="middle" class="b">정식 proof의 모든 기술조건을 이 그림 하나가 대체하지 않는다.</text><text x="640" y="652" text-anchor="middle" class="b">specific Map₁ 계산은 G03/A01의 assumption-scoped result다.</text></svg>