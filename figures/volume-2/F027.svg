<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:19px}.box{fill:#f8fafc;stroke:#475569;stroke-width:3}.odd{fill:#fef2f2;stroke:#dc2626;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;marker-end:url(#a)}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><text x="640" y="50" text-anchor="middle" class="t">F027 · 2π→−1, 4π→+1 흐름</text><rect x="80" y="150" width="300" height="210" rx="20" class="box"/><rect x="490" y="150" width="300" height="210" rx="20" class="odd"/><rect x="900" y="150" width="300" height="210" rx="20" class="box"/><text x="230" y="205" text-anchor="middle" class="h">시작</text><text x="230" y="275" text-anchor="middle" class="h">Ψ</text><text x="640" y="205" text-anchor="middle" class="h">2π, generator 1회</text><text x="640" y="275" text-anchor="middle" class="h">Ψ → −Ψ</text><text x="1050" y="205" text-anchor="middle" class="h">4π, generator 2회</text><text x="1050" y="275" text-anchor="middle" class="h">−Ψ → +Ψ</text><line x1="380" y1="255" x2="480" y2="255" class="arr"/><line x1="790" y1="255" x2="890" y2="255" class="arr"/><text x="640" y="440" text-anchor="middle" class="h">이 흐름은 FR-odd character를 채택했을 때만 성립한다.</text><rect x="120" y="525" width="1040" height="145" rx="18" class="w"/><text x="640" y="568" text-anchor="middle" class="b">CONDITIONAL — actual physical configuration space, cover/lift, rotation action이 올바르게 정해져야 한다.</text><text x="640" y="607" text-anchor="middle" class="b">−1은 wavefunction sign/boundary condition이지 observable이 음수가 된다는 뜻이 아니다.</text><text x="640" y="645" text-anchor="middle" class="b">complete spin-1/2, j=1/2 ground, electron identity는 자동으로 따라오지 않는다.</text></svg>