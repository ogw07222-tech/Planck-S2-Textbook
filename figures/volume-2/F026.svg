<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:19px}.plus{fill:#f0fdf4;stroke:#16a34a;stroke-width:3}.minus{fill:#fef2f2;stroke:#dc2626;stroke-width:3}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><text x="640" y="50" text-anchor="middle" class="t">F026 · FR +1 / −1 sector</text><rect x="90" y="120" width="500" height="350" rx="22" class="plus"/><rect x="690" y="120" width="500" height="350" rx="22" class="minus"/><text x="340" y="175" text-anchor="middle" class="h">even character</text><text x="940" y="175" text-anchor="middle" class="h">odd character</text><text x="340" y="245" text-anchor="middle" class="h">χ(g)=+1</text><text x="940" y="245" text-anchor="middle" class="h">χ(g)=−1</text><text x="340" y="310" text-anchor="middle" class="b">nontrivial deck transformation 아래</text><text x="340" y="350" text-anchor="middle" class="b">wavefunction이 같은 값</text><text x="940" y="310" text-anchor="middle" class="b">nontrivial deck transformation 아래</text><text x="940" y="350" text-anchor="middle" class="b">wavefunction이 부호 반전</text><text x="640" y="520" text-anchor="middle" class="h">π₁=Z₂라는 topology만으로 어느 character가 physical인지 결정되지 않는다.</text><rect x="150" y="580" width="980" height="100" rx="16" class="w"/><text x="640" y="620" text-anchor="middle" class="b">FR-odd physical 적용은 CONDITIONAL.</text><text x="640" y="652" text-anchor="middle" class="b">global phase 하나와 topological boundary/lift condition을 혼동하지 않는다.</text></svg>