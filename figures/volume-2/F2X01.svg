<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<rect width="1280" height="760" fill="white"/>
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.panel{fill:#f8fafc;stroke:#475569;stroke-width:3}.path{fill:none;stroke:#2563eb;stroke-width:6}.path2{fill:none;stroke:#7c3aed;stroke-width:6}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.axis{stroke:#64748b;stroke-width:3}.arrow{stroke:#111827;stroke-width:5;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
<text x="640" y="52" text-anchor="middle" class="title">F2X01 · 같은 최종 orientation, 다른 rotation path 질문</text>
<rect x="55" y="95" width="360" height="420" rx="20" class="panel"/>
<rect x="460" y="95" width="360" height="420" rx="20" class="panel"/>
<rect x="865" y="95" width="360" height="420" rx="20" class="panel"/>
<text x="235" y="140" text-anchor="middle" class="h">시작</text>
<line x1="235" y1="190" x2="235" y2="385" class="axis"/>
<line x1="235" y1="285" x2="325" y2="285" class="arrow"/>
<text x="235" y="435" text-anchor="middle" class="b">기준 orientation</text>
<text x="640" y="140" text-anchor="middle" class="h">360° 회전 후</text>
<line x1="640" y1="190" x2="640" y2="385" class="axis"/>
<line x1="640" y1="285" x2="730" y2="285" class="arrow"/>
<path d="M545,320 C515,220 560,170 640,170 C720,170 765,220 735,320" class="path"/>
<text x="640" y="435" text-anchor="middle" class="b">최종 orientation은 시작과 같음</text>
<text x="1045" y="140" text-anchor="middle" class="h">그래도 남는 질문</text>
<path d="M930,300 C960,205 1130,205 1160,300 C1130,395 960,395 930,300 Z" class="path2"/>
<circle cx="930" cy="300" r="9" fill="#111827"/>
<text x="1045" y="430" text-anchor="middle" class="b">이 닫힌 path는</text>
<text x="1045" y="460" text-anchor="middle" class="b">점으로 줄일 수 있는가?</text>
<rect x="110" y="560" width="1060" height="135" rx="18" class="warn"/>
<text x="640" y="600" text-anchor="middle" class="s">개념도 — 실제 Planck-S² configuration space 모양이 아님</text>
<text x="640" y="632" text-anchor="middle" class="s">SO(3)에서 최종 orientation의 동일성과 rotation path의 contractibility는 서로 다른 질문이다.</text>
<text x="640" y="664" text-anchor="middle" class="s">이 그림만으로 Planck-S²의 2π→−1, FR-odd, spin-1/2을 결론내리지 않는다.</text>
</svg>