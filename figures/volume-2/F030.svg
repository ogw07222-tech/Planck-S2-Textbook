<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:18px}.left{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.right{fill:#fefce8;stroke:#ca8a04;stroke-width:3}.mid{fill:#f8fafc;stroke:#475569;stroke-width:3}.arr{stroke:#475569;stroke-width:5;marker-end:url(#a)}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="640" y="50" text-anchor="middle" class="t">F030 · Gate C physical configuration-space fork</text><rect x="445" y="105" width="390" height="130" rx="20" class="mid"/><text x="640" y="155" text-anchor="middle" class="h">후보 n-field theory</text><text x="640" y="195" text-anchor="middle" class="b">physical ontology / quotient 선택은 OPEN</text><rect x="70" y="360" width="500" height="250" rx="22" class="left"/><rect x="710" y="360" width="500" height="250" rx="22" class="right"/><line x1="545" y1="235" x2="320" y2="350" class="arr"/><line x1="735" y1="235" x2="960" y2="350" class="arr"/><text x="320" y="410" text-anchor="middle" class="h">unquotiented branch</text><text x="320" y="460" text-anchor="middle" class="b">ideal smooth Map₁에서 π₁≅Z₂</text><text x="320" y="500" text-anchor="middle" class="b">2π spatial loop generator result 생존</text><text x="320" y="545" text-anchor="middle" class="b">physical 적용은 자동 아님</text><text x="960" y="410" text-anchor="middle" class="h">target quotient branch</text><text x="960" y="460" text-anchor="middle" class="b">smooth principal-bundle assumptions 아래 π₁=0</text><text x="960" y="500" text-anchor="middle" class="b">identity background의 표준 spatial loop는 constant</text><text x="960" y="545" text-anchor="middle" class="b">모든 physical completion으로 확대 금지</text><rect x="160" y="650" width="960" height="70" rx="14" class="w"/><text x="640" y="694" text-anchor="middle" class="h">그림은 physical branch를 선택해 주지 않는다 — Gate C overall = OPEN</text></svg>