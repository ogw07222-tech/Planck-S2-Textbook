<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="white"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.t{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:19px}.p{fill:#f8fafc;stroke:#475569;stroke-width:3}.x{stroke:#dc2626;stroke-width:6}.y{stroke:#16a34a;stroke-width:6}.z{stroke:#2563eb;stroke-width:6}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><text x="640" y="50" text-anchor="middle" class="t">F019 · 세 축 회전과 SO(3)</text><rect x="70" y="105" width="700" height="450" rx="22" class="p"/><line x1="420" y1="340" x2="655" y2="340" class="x"/><line x1="420" y1="340" x2="270" y2="190" class="y"/><line x1="420" y1="340" x2="420" y2="145" class="z"/><text x="675" y="345" class="h">x</text><text x="245" y="180" class="h">y</text><text x="430" y="140" class="h">z</text><path d="M540 300 A130 130 0 0 1 520 430" fill="none" stroke="#dc2626" stroke-width="4"/><path d="M340 235 A135 135 0 0 1 300 375" fill="none" stroke="#16a34a" stroke-width="4"/><path d="M335 420 A135 135 0 0 1 520 420" fill="none" stroke="#2563eb" stroke-width="4"/><text x="420" y="505" text-anchor="middle" class="b">각 축 주위 회전은 SO(3)의 서로 다른 one-parameter path를 만든다.</text><rect x="820" y="105" width="390" height="450" rx="22" class="w"/><text x="1015" y="155" text-anchor="middle" class="h">중요한 경고</text><text x="850" y="210" class="b">• SO(3)는 회전들의 group/manifold다.</text><text x="850" y="255" class="b">• 단순한 보통 3D ball 그 자체가 아니다.</text><text x="850" y="300" class="b">• axis-angle로 ball처럼 나타낼 때</text><text x="870" y="335" class="b">경계의 antipodal points를 식별해야 한다.</text><text x="850" y="385" class="b">• 회전 순서는 일반적으로 중요하다.</text><text x="850" y="430" class="b">Rx Ry ≠ Ry Rx 일 수 있다.</text><text x="640" y="650" text-anchor="middle" class="h">개념도 — 실제 SO(3)를 평범한 공으로 묘사한 그림이 아님</text></svg>