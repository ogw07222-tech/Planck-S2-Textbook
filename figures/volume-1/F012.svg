<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="white"/>
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:38px;font-weight:700}.label{font-size:28px;font-weight:700}.small{font-size:22px}.tiny{font-size:19px}.dom{fill:#eef6ff;stroke:#2b6cb0;stroke-width:4}.tar{fill:#eefaf1;stroke:#2f855a;stroke-width:4}.map1{stroke:#2b6cb0;stroke-width:5;fill:none;marker-end:url(#arr1)}.map2{stroke:#805ad5;stroke-width:5;fill:none;marker-end:url(#arr2)}.pt1{fill:#2b6cb0}.pt2{fill:#805ad5}.pty{fill:#2f855a}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:2}
  </style>
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#805ad5"/></marker>
  </defs>
  <text x="600" y="55" text-anchor="middle" class="title">F012  degree Q = 2 — 일반적인 target 점에 두 preimage가 있는 대표 그림</text>
  <circle cx="300" cy="330" r="180" class="dom"/>
  <circle cx="900" cy="330" r="180" class="tar"/>
  <text x="300" y="125" text-anchor="middle" class="label">domain S²</text>
  <text x="900" y="125" text-anchor="middle" class="label">target S²</text>
  <circle cx="260" cy="245" r="14" class="pt1"/><text x="205" y="240" class="small">x₁</text>
  <circle cx="345" cy="410" r="14" class="pt2"/><text x="365" y="418" class="small">x₂</text>
  <circle cx="900" cy="315" r="15" class="pty"/><text x="925" y="322" class="small">y</text>
  <path d="M275 245 C510 210,675 250,884 312" class="map1"/>
  <path d="M360 410 C545 445,700 385,884 320" class="map2"/>
  <text x="600" y="535" text-anchor="middle" class="label">regular한 y 근처에서 +1 local contribution 두 개 → 총 degree +2</text>
  <rect x="120" y="575" width="960" height="105" rx="16" class="note"/>
  <text x="600" y="609" text-anchor="middle" class="small">이 그림은 degree 2의 전역 구조를 한 장에 정확히 펼친 그림이 아니라, local-degree 합을 보여 주는 개념도다.</text>
  <text x="600" y="642" text-anchor="middle" class="tiny">Q=2는 입자 두 개, 에너지 두 배, 정보 2 bit를 뜻하지 않는다.</text>
  <text x="600" y="670" text-anchor="middle" class="tiny">실제 smooth map은 국소적으로 휘거나 branch-like 구조를 가질 수 있다.</text>
</svg>