<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <rect width="1500" height="720" fill="white"/>
  <style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:38px;font-weight:700}.head{font-size:29px;font-weight:700}.small{font-size:23px}.box{fill:#fafafa;stroke:#9aa4b2;stroke-width:3}.axis{stroke:#333;stroke-width:3}.arrow{stroke:#c53030;stroke-width:5;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c53030"/></marker><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs>
  <text x="750" y="55" text-anchor="middle" class="title">F1X02 서로 다른 세 종류의 map</text>
  <rect x="40" y="100" width="440" height="530" rx="18" class="box"/><rect x="530" y="100" width="440" height="530" rx="18" class="box"/><rect x="1020" y="100" width="440" height="530" rx="18" class="box"/>
  <text x="260" y="150" text-anchor="middle" class="head">① 숫자 → 숫자</text><text x="260" y="190" text-anchor="middle" class="small">f: ℝ → ℝ, f(x)=2x</text>
  <line x1="110" y1="360" x2="410" y2="360" class="axis"/><line x1="110" y1="460" x2="410" y2="460" class="axis"/>
  <text x="70" y="370" class="small">입력</text><text x="70" y="470" class="small">출력</text>
  <g class="small" text-anchor="middle"><text x="140" y="340">−2</text><text x="200" y="340">−1</text><text x="260" y="340">0</text><text x="320" y="340">1</text><text x="380" y="340">2</text><text x="140" y="500">−4</text><text x="200" y="500">−2</text><text x="260" y="500">0</text><text x="320" y="500">2</text><text x="380" y="500">4</text></g>
  <g stroke="#666" stroke-width="2"><line x1="140" y1="365" x2="140" y2="445"/><line x1="200" y1="365" x2="200" y2="445"/><line x1="260" y1="365" x2="260" y2="445"/><line x1="320" y1="365" x2="320" y2="445"/><line x1="380" y1="365" x2="380" y2="445"/></g>
  <text x="260" y="580" text-anchor="middle" class="small">숫자를 넣으면 숫자가 나온다.</text>
  <text x="750" y="150" text-anchor="middle" class="head">② 점 → 색</text><text x="750" y="190" text-anchor="middle" class="small">g: 선분의 점 → 색</text>
  <line x1="610" y1="330" x2="890" y2="330" class="axis"/><g fill="#111"><circle cx="630" cy="330" r="7"/><circle cx="690" cy="330" r="7"/><circle cx="750" cy="330" r="7"/><circle cx="810" cy="330" r="7"/><circle cx="870" cy="330" r="7"/></g><g stroke="#666" stroke-width="2"><line x1="630" y1="340" x2="630" y2="405"/><line x1="690" y1="340" x2="690" y2="405"/><line x1="750" y1="340" x2="750" y2="405"/><line x1="810" y1="340" x2="810" y2="405"/><line x1="870" y1="340" x2="870" y2="405"/></g><rect x="610" y="420" width="280" height="65" fill="url(#g)"/>
  <text x="750" y="550" text-anchor="middle" class="small">각 점에 하나의 색을 붙일 수 있다.</text>
  <text x="1240" y="150" text-anchor="middle" class="head">③ 점 → 방향</text><text x="1240" y="190" text-anchor="middle" class="small">h: 점들의 집합 → 방향</text>
  <g><line x1="1110" y1="330" x2="1160" y2="305" class="arrow"/><line x1="1220" y1="315" x2="1195" y2="260" class="arrow"/><line x1="1330" y1="335" x2="1275" y2="320" class="arrow"/><line x1="1160" y1="460" x2="1185" y2="395" class="arrow"/><line x1="1320" y1="455" x2="1365" y2="500" class="arrow"/></g>
  <text x="1240" y="580" text-anchor="middle" class="small">각 점에 하나의 방향(화살표)을 붙일 수 있다.</text>
  <text x="750" y="675" text-anchor="middle" class="small">세 예는 서로 다른 map이며, 점→방향 예는 Planck-S²의 물리적 실재를 증명하지 않는다.</text>
</svg>
