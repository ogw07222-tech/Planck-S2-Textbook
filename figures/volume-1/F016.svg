<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="white"/>
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:36px;font-weight:700}.h{font-size:28px;font-weight:700}.b{font-size:21px}.s{font-size:18px}.space{fill:#f7fafc;stroke:#4a5568;stroke-width:3}.pt{fill:#eef6ff;stroke:#2b6cb0;stroke-width:4}.warn{fill:#fff8e6;stroke:#b7791f;stroke-width:3}.curve{stroke:#805ad5;stroke-width:6;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#805ad5"/></marker></defs>
  <text x="640" y="52" text-anchor="middle" class="title">F016  출발 configuration으로 돌아오는 loop</text>
  <rect x="100" y="105" width="1080" height="440" rx="30" class="space"/>
  <text x="640" y="150" text-anchor="middle" class="h">configuration space</text>
  <circle cx="350" cy="355" r="36" class="pt"/>
  <text x="350" y="415" text-anchor="middle" class="b">n₀ = γ(0) = γ(1)</text>
  <path d="M378 337 C530 165 895 205 915 360 C930 495 590 525 382 383" class="curve"/>
  <circle cx="650" cy="230" r="11" fill="#805ad5"/><circle cx="915" cy="360" r="11" fill="#805ad5"/><circle cx="655" cy="492" r="11" fill="#805ad5"/>
  <text x="650" y="205" text-anchor="middle" class="s">중간 configuration</text>
  <text x="930" y="335" class="s">γ(t)</text>
  <text x="640" y="515" text-anchor="middle" class="b">끝에서 configuration은 같아졌지만, 어떤 경로를 돌았는지는 별도 정보다.</text>

  <rect x="155" y="585" width="970" height="105" rx="20" class="warn"/>
  <text x="640" y="620" text-anchor="middle" class="b">γ(0)=γ(1)  ⇒  closed path(loop)</text>
  <text x="640" y="654" text-anchor="middle" class="s">그러나 endpoint가 같다는 사실만으로 loop가 수축 가능한지(trivial한지)는 결정되지 않는다.</text>
  <text x="640" y="720" text-anchor="middle" class="s">개념도 — 특정 2π rotation loop, Z₂ generator, FR 판정을 그린 것이 아님</text>
</svg>