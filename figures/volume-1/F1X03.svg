<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="white"/>
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:38px;font-weight:700}.label{font-size:28px;font-weight:700}.small{font-size:22px}.tiny{font-size:19px}.panel{fill:#fbfdff;stroke:#7aa2d6;stroke-width:3}.cell{stroke:#d8e2ee;stroke-width:2}.wind{stroke:#2b6cb0;stroke-width:5;fill:none;marker-end:url(#arr)}
  </style>
  <defs>
    <linearGradient id="temp" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#f7d154"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/></marker>
  </defs>
  <text x="600" y="55" text-anchor="middle" class="title">F1X03 날씨 지도에서 보는 두 종류의 장(field)</text>

  <rect x="55" y="105" width="520" height="500" rx="22" class="panel"/>
  <rect x="625" y="105" width="520" height="500" rx="22" class="panel"/>
  <text x="315" y="150" text-anchor="middle" class="label">① 온도 지도 — 스칼라장</text>
  <text x="885" y="150" text-anchor="middle" class="label">② 바람 지도 — 방향/벡터장</text>

  <rect x="105" y="195" width="80" height="70" fill="#60a5fa" class="cell"/><rect x="185" y="195" width="80" height="70" fill="#93c5fd" class="cell"/><rect x="265" y="195" width="80" height="70" fill="#fde68a" class="cell"/><rect x="345" y="195" width="80" height="70" fill="#fca5a5" class="cell"/><rect x="425" y="195" width="80" height="70" fill="#ef4444" class="cell"/>
  <rect x="105" y="265" width="80" height="70" fill="#3b82f6" class="cell"/><rect x="185" y="265" width="80" height="70" fill="#60a5fa" class="cell"/><rect x="265" y="265" width="80" height="70" fill="#f7d154" class="cell"/><rect x="345" y="265" width="80" height="70" fill="#f59e0b" class="cell"/><rect x="425" y="265" width="80" height="70" fill="#f87171" class="cell"/>
  <rect x="105" y="335" width="80" height="70" fill="#93c5fd" class="cell"/><rect x="185" y="335" width="80" height="70" fill="#bfdbfe" class="cell"/><rect x="265" y="335" width="80" height="70" fill="#fde68a" class="cell"/><rect x="345" y="335" width="80" height="70" fill="#fca5a5" class="cell"/><rect x="425" y="335" width="80" height="70" fill="#fb7185" class="cell"/>
  <text x="145" y="240" text-anchor="middle" class="small">12°</text><text x="225" y="240" text-anchor="middle" class="small">15°</text><text x="305" y="240" text-anchor="middle" class="small">21°</text><text x="385" y="240" text-anchor="middle" class="small">26°</text><text x="465" y="240" text-anchor="middle" class="small">30°</text>
  <text x="145" y="310" text-anchor="middle" class="small">10°</text><text x="225" y="310" text-anchor="middle" class="small">13°</text><text x="305" y="310" text-anchor="middle" class="small">20°</text><text x="385" y="310" text-anchor="middle" class="small">24°</text><text x="465" y="310" text-anchor="middle" class="small">28°</text>
  <text x="145" y="380" text-anchor="middle" class="small">14°</text><text x="225" y="380" text-anchor="middle" class="small">16°</text><text x="305" y="380" text-anchor="middle" class="small">22°</text><text x="385" y="380" text-anchor="middle" class="small">25°</text><text x="465" y="380" text-anchor="middle" class="small">27°</text>
  <rect x="120" y="445" width="370" height="24" fill="url(#temp)"/><text x="120" y="500" class="tiny">낮은 값</text><text x="445" y="500" class="tiny">높은 값</text>
  <text x="315" y="550" text-anchor="middle" class="small">각 위치에 숫자 하나: φ(x)</text>

  <g transform="translate(665 190)">
    <rect x="0" y="0" width="440" height="245" fill="#f7fbff" stroke="#d8e2ee" stroke-width="2"/>
    <path d="M45 55 l55 -12" class="wind"/><path d="M155 55 l48 18" class="wind"/><path d="M265 55 l20 50" class="wind"/><path d="M365 55 l-45 32" class="wind"/>
    <path d="M45 130 l45 25" class="wind"/><path d="M155 130 l58 -5" class="wind"/><path d="M265 130 l-18 55" class="wind"/><path d="M365 130 l-55 -20" class="wind"/>
    <path d="M45 205 l20 -50" class="wind"/><path d="M155 205 l-45 -35" class="wind"/><path d="M265 205 l50 -20" class="wind"/><path d="M365 205 l35 40" class="wind"/>
  </g>
  <text x="885" y="475" text-anchor="middle" class="small">각 위치에 방향/벡터 하나: v(x)</text>
  <text x="885" y="510" text-anchor="middle" class="tiny">화살표 길이가 크기를 나타낼 수도 있지만,</text>
  <text x="885" y="538" text-anchor="middle" class="tiny">단위벡터장에서는 길이를 1로 고정해 방향만 남길 수 있다.</text>

  <text x="600" y="650" text-anchor="middle" class="small">비유용 개념도 — 실제 기상 관측 자료가 아니며, 장(field)이 반드시 공기나 유체를 뜻하는 것도 아니다.</text>
</svg>