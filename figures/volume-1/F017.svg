<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<rect width="1280" height="760" fill="white"/>
<style>
text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.panel{fill:#f8fafc;stroke:#475569;stroke-width:3}.loop{fill:none;stroke:#334155;stroke-width:6}.pillar{fill:#e2e8f0;stroke:#64748b;stroke-width:3}.dot{fill:#111827}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}
</style>
<text x="640" y="55" text-anchor="middle" class="title">F017 · contractible vs noncontractible loop</text>
<rect x="55" y="95" width="550" height="420" rx="20" class="panel"/>
<rect x="675" y="95" width="550" height="420" rx="20" class="panel"/>
<text x="330" y="135" text-anchor="middle" class="h">수축 가능한 예</text>
<text x="950" y="135" text-anchor="middle" class="h">장애물이 있는 비유적 예</text>
<circle cx="330" cy="315" r="125" class="loop"/>
<circle cx="330" cy="315" r="70" class="loop" opacity="0.65"/>
<circle cx="330" cy="315" r="16" class="dot"/>
<text x="330" y="470" text-anchor="middle" class="b">loop를 끊지 않고 constant loop까지 줄이는 그림</text>
<rect x="900" y="205" width="100" height="220" rx="20" class="pillar"/>
<path d="M790 315 C790 190 1110 190 1110 315 C1110 440 790 440 790 315Z" class="loop"/>
<circle cx="790" cy="315" r="10" class="dot"/>
<text x="950" y="470" text-anchor="middle" class="b">기둥을 감싼 고무줄은 이 그림의 공간에서는 쉽게 못 줄임</text>
<rect x="70" y="550" width="1140" height="150" rx="18" class="warn"/>
<text x="640" y="590" text-anchor="middle" class="h">개념도 — 실제 Planck-S² configuration space 모양이 아님</text>
<text x="640" y="630" text-anchor="middle" class="b">어느 loop가 실제로 nontrivial한지는 그 공간의 topology와 허용된 homotopy 조건에 의존한다.</text>
<text x="640" y="665" text-anchor="middle" class="s">기둥 비유만 보고 Planck-S²의 특정 loop가 noncontractible이라고 결론내리면 안 된다.</text>
</svg>