<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="white"/>
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:36px;font-weight:700}.h{font-size:28px;font-weight:700}.b{font-size:21px}.s{font-size:18px}.outer{fill:#f7fafc;stroke:#4a5568;stroke-width:3}.comp{fill:#eef6ff;stroke:#2b6cb0;stroke-width:3}.focus{fill:#eefaf1;stroke:#2f855a;stroke-width:5}.warn{fill:#fff8e6;stroke:#b7791f;stroke-width:3}
  </style>
  <text x="640" y="52" text-anchor="middle" class="title">F1X06  Map(S²,S²) 안의 degree별 component 개념도</text>
  <rect x="70" y="110" width="1140" height="430" rx="28" class="outer"/>
  <text x="640" y="155" text-anchor="middle" class="h">Map(S²,S²)</text>
  <text x="640" y="190" text-anchor="middle" class="s">가능한 S²→S² map들을 모은 ideal mapping space</text>

  <rect x="120" y="250" width="180" height="180" rx="25" class="comp"/>
  <rect x="335" y="250" width="180" height="180" rx="25" class="comp"/>
  <rect x="550" y="235" width="180" height="210" rx="25" class="focus"/>
  <rect x="765" y="250" width="180" height="180" rx="25" class="comp"/>
  <rect x="980" y="250" width="180" height="180" rx="25" class="comp"/>

  <text x="210" y="315" text-anchor="middle" class="h">Q = −1</text><text x="210" y="360" text-anchor="middle" class="s">degree −1</text>
  <text x="425" y="315" text-anchor="middle" class="h">Q = 0</text><text x="425" y="360" text-anchor="middle" class="s">degree 0</text>
  <text x="640" y="305" text-anchor="middle" class="h">Q = +1</text><text x="640" y="350" text-anchor="middle" class="b">Map₁(S²,S²)</text><text x="640" y="390" text-anchor="middle" class="s">이번 프로젝트의 후보 sector</text>
  <text x="855" y="315" text-anchor="middle" class="h">Q = 2</text><text x="855" y="360" text-anchor="middle" class="s">degree 2</text>
  <text x="1070" y="315" text-anchor="middle" class="h">…</text><text x="1070" y="360" text-anchor="middle" class="s">다른 정수 degree</text>

  <rect x="150" y="585" width="980" height="100" rx="20" class="warn"/>
  <text x="640" y="625" text-anchor="middle" class="b">degree가 다르면 같은 connected component로 연속 이동할 수 없다는 표준 직관을 표시한다.</text>
  <text x="640" y="660" text-anchor="middle" class="s">단, actual physical configuration space가 이 ideal Map과 동일하다는 뜻은 아니다.</text>
  <text x="640" y="720" text-anchor="middle" class="s">개념도 — component의 실제 기하·거리·차원을 그린 그림이 아님</text>
</svg>