<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="white"/>
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111}.title{font-size:38px;font-weight:700}.label{font-size:28px;font-weight:700}.small{font-size:22px}.tiny{font-size:19px}.panel{fill:#fbfdff;stroke:#7aa2d6;stroke-width:3}.axis1{stroke:#2b6cb0;stroke-width:8;fill:none;marker-end:url(#a1)}.axis2{stroke:#d53f8c;stroke-width:8;fill:none;marker-end:url(#a2)}.curve{stroke:#555;stroke-width:4;fill:none;marker-end:url(#arr)}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:2}
  </style>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d53f8c"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker>
  </defs>
  <text x="600" y="55" text-anchor="middle" class="title">F1X04  orientation — 작은 표식의 순서가 유지되는가, 뒤집히는가?</text>
  <rect x="55" y="110" width="500" height="455" rx="22" class="panel"/>
  <rect x="645" y="110" width="500" height="455" rx="22" class="panel"/>
  <text x="305" y="155" text-anchor="middle" class="label">① orientation 보존</text>
  <text x="895" y="155" text-anchor="middle" class="label">② orientation 반전</text>
  <circle cx="305" cy="335" r="120" fill="#eef6ff" stroke="#2b6cb0" stroke-width="3"/>
  <circle cx="895" cy="335" r="120" fill="#fff3f3" stroke="#c53030" stroke-width="3"/>
  <path d="M305 335 L395 335" class="axis1"/><path d="M305 335 L305 245" class="axis2"/>
  <path d="M895 335 L985 335" class="axis1"/><path d="M895 335 L895 425" class="axis2"/>
  <text x="402" y="342" class="small">u</text><text x="312" y="238" class="small">v</text>
  <text x="992" y="342" class="small">u</text><text x="902" y="452" class="small">v</text>
  <path d="M340 300 C370 285,385 300,390 325" class="curve"/>
  <path d="M930 370 C960 385,975 370,980 345" class="curve"/>
  <text x="305" y="500" text-anchor="middle" class="small">u→v의 local 순서를 유지</text>
  <text x="895" y="500" text-anchor="middle" class="small">거울처럼 local 순서를 뒤집음</text>
  <rect x="115" y="595" width="970" height="82" rx="16" class="note"/>
  <text x="600" y="628" text-anchor="middle" class="small">degree의 부호는 이런 orientation 정보와 연결된다.</text>
  <text x="600" y="659" text-anchor="middle" class="tiny">이 표식은 orientation 직관용이며 실제 구면 위에 u,v 화살표가 물질적으로 박혀 있다는 뜻이 아니다.</text>
</svg>